[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "terminalweave"
version = "1.0.0"
description = "Container terminal planning and operations engine"
requires-python = ">=3.10"
authors = [{name = "TerminalWeave Engineering"}]
license = {text = "MIT"}

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
terminalweave = "terminalweave.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
